<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farrey</title>
  </head>
  <body>
    <div id="app" class="note" data-color="yellow">
      <header class="titlebar" id="titlebar">
        <div class="tb-side tb-left" id="tb-left">
          <button
            id="btn-new"
            class="tb-btn"
            title="New sticker (Cmd/Ctrl+N)"
            aria-label="New sticker"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                d="M8 3v10M3 8h10"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </button>
          <button
            id="btn-pin"
            class="tb-btn"
            title="Float on top"
            aria-label="Float on top"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <rect x="2.5" y="2" width="11" height="2.2" rx="1" fill="currentColor" />
              <rect
                x="2.5"
                y="6"
                width="11"
                height="8"
                rx="1.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
              />
            </svg>
          </button>
          <button
            id="btn-color"
            class="tb-btn"
            title="Color and opacity"
            aria-label="Color and opacity"
          >
            <span class="dot"></span>
          </button>
          <button
            id="btn-mode"
            class="tb-btn md-btn"
            title="README mode: off (click to use this sticker as a Markdown file)"
            aria-label="README mode"
            aria-pressed="false"
          >
            <span>MD</span>
          </button>
        </div>
        <div class="tb-title" id="tb-title">Farrey</div>
        <div class="tb-side tb-right" id="tb-right">
          <button id="btn-close" class="tb-btn" title="Close" aria-label="Close">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path
                d="M4 4l8 8M12 4l-8 8"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </button>
        </div>
      </header>
      <main id="content">
        <div id="rich-wrap" class="rich-wrap" hidden>
          <div
            id="rich"
            class="rich"
            contenteditable="true"
            spellcheck="true"
            role="textbox"
            aria-multiline="true"
            aria-label="Note"
          ></div>
          <div id="richbar" class="richbar">
            <select id="rich-font" title="Font" aria-label="Font"></select>
            <button
              id="rich-smaller"
              class="tb-btn"
              title="Smaller text"
              aria-label="Smaller text"
            >
              <span class="rb-a">A−</span>
            </button>
            <span id="rich-size" class="rich-size" title="Text size"></span>
            <button
              id="rich-bigger"
              class="tb-btn"
              title="Bigger text"
              aria-label="Bigger text"
            >
              <span class="rb-a">A+</span>
            </button>
            <span class="rb-sep"></span>
            <button
              class="tb-btn"
              data-cmd="bold"
              title="Bold (Cmd/Ctrl+B)"
              aria-label="Bold"
            >
              <b>B</b>
            </button>
            <button
              class="tb-btn"
              data-cmd="italic"
              title="Italic (Cmd/Ctrl+I)"
              aria-label="Italic"
            >
              <i>I</i>
            </button>
            <button
              class="tb-btn"
              data-cmd="underline"
              title="Underline (Cmd/Ctrl+U)"
              aria-label="Underline"
            >
              <u>U</u>
            </button>
            <button
              class="tb-btn"
              data-cmd="strikeThrough"
              title="Strikethrough"
              aria-label="Strikethrough"
            >
              <s>S</s>
            </button>
            <span class="rb-sep"></span>
            <button
              class="tb-btn"
              data-cmd="insertUnorderedList"
              title="Bullet list"
              aria-label="Bullet list"
            >
              •≡
            </button>
            <button
              class="tb-btn"
              data-cmd="insertOrderedList"
              title="Numbered list"
              aria-label="Numbered list"
            >
              1.
            </button>
            <button
              class="tb-btn"
              data-cmd="heading"
              title="Heading"
              aria-label="Heading"
            >
              <b>H</b>
            </button>
            <button
              class="tb-btn"
              data-cmd="clear"
              title="Clear formatting"
              aria-label="Clear formatting"
            >
              Tx
            </button>
          </div>
        </div>
        <div id="empty" class="empty">
          <h1>Farrey</h1>
          <p id="empty-hint">Drop a README.md here, or</p>
          <div class="empty-actions">
            <button id="btn-open-empty" class="btn">Open file…</button>
            <button id="btn-new-empty" class="btn">New note…</button>
          </div>
        </div>
        <article id="preview" class="md" hidden></article>
        <textarea id="editor" spellcheck="true" hidden></textarea>
        <div id="findbar" class="findbar" hidden>
          <input
            id="find-input"
            type="text"
            placeholder="Find"
            spellcheck="false"
            autocomplete="off"
          />
          <span id="find-count" class="find-count"></span>
          <button
            id="find-prev"
            class="tb-btn"
            title="Previous (Shift+Enter)"
            aria-label="Previous match"
          >
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path
                d="M3.5 10l4.5-4.5 4.5 4.5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
            </svg>
          </button>
          <button
            id="find-next"
            class="tb-btn"
            title="Next (Enter)"
            aria-label="Next match"
          >
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path
                d="M3.5 6l4.5 4.5L12.5 6"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
            </svg>
          </button>
          <button
            id="find-close"
            class="tb-btn"
            title="Close (Esc)"
            aria-label="Close find"
          >
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path
                d="M4 4l8 8M12 4l-8 8"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
          </button>
        </div>
        <div id="toc" class="toc" hidden></div>
        <div id="toast" class="toast" hidden></div>
      </main>
      <div id="popover" class="popover" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
