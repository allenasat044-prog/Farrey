[package]
name = "farrey"
version = "0.1.0"
description = "A Stickies-style desktop note that is backed by a live README.md"
edition = "2021"

[lib]
name = "farrey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
