[package]
name = "farrey"
version = "0.2.0"
description = "A Stickies-style desktop note that is backed by a live README.md"
authors = ["Farrey contributors"]
license = "MIT"
repository = "https://github.com/allenasat044-prog/Farrey"
edition = "2021"

[lib]
name = "farrey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
